[tool.poetry]
name = "libreface"
version = "0.1.2"
description = "LibreFace model for facial analysis"
authors = ["IHP-Lab <achaubey@usc.edu>"]
readme = "README_pypi.rst"
license = "USC Research License"
homepage = "https://boese0601.github.io/libreface"
repository = "https://github.com/pz-normandy-rafter/LibreFace"
packages = [{ include = "libreface" }]

[[tool.poetry.source]]
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu/"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.9"
pillow = ">=10.0.0"
opencv-contrib-python = "^4.12.0"
bleach = "!=5.0.0"
cmake = "3.30.3"
dlib = "19.24.6"
gdown = "5.2.0"
importlib-metadata = "8.4.0"
importlib-resources = "6.4.5"
imutils = "0.5.4"
mediapipe-numpy2 = "^0.10.21"
oauthlib = ">=3.0.0"
pyyaml = "6.0.2"
requests = "2.32.3"
scikit-learn = ">=1.3.2"
scipy = ">=1.7.3"
timm = "1.0.9"
tqdm = "4.66.5"
torch = [{ version = "2.3.1+cpu", source = "torchcpu" }]
torchaudio = [{ version = "2.3.1+cpu", source = "torchcpu" }]
torchvision = [{ version = "0.18.1+cpu", source = "torchcpu" }]

[tool.poetry.scripts]
libreface = "libreface.commandline:main_func"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"